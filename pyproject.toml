[tool.poetry]
name = "pySigma-pipeline-macos"
version = "0.1.0"
description = "pySigma processing pipelines for macOS Endpoint Security, Unified Log and CrowdStrike Falcon telemetry"
readme = "README.md"
authors = ["Eric Brown - Nebulock, Inc."]
license = "MIT"
repository = "https://github.com/Nebulock-Inc/pySigma-pipeline-macos"
keywords = ["sigma", "pysigma", "macos", "endpoint security", "unified log", "detection"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
packages = [
    { include = "sigma" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pysigma = ">=1.1.1,<3"

[tool.poetry.group.dev.dependencies]
black = ">=24.10"
pytest = ">=8.3"
pytest-cov = ">=6.0"
pysigma-backend-elasticsearch = ">=2.1.0"
pysigma-backend-splunk = ">=2.1.0"
pysigma-backend-crowdstrike = ">=3.0.0"
pysigma-backend-kusto = ">=1.0.1"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
